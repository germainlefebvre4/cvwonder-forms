name: Release Assets

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: zip -r dist.zip dist
      - run: gh release upload "${{ github.ref_name }}" dist.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
